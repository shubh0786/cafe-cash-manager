<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="98" fill="#002e6d"/>
  <circle cx="100" cy="100" r="94" fill="none" stroke="#c9a84c" stroke-width="2.5"/>

  <!-- Minimal crown -->
  <g transform="translate(100,88)" fill="none" stroke="#f0e6cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crown base -->
    <line x1="-32" y1="16" x2="32" y2="16"/>
    <!-- Crown body -->
    <polyline points="-32,16 -32,0 -16,-14 0,0 16,-14 32,0 32,16"/>
    <!-- Crown jewels -->
    <circle cx="-16" cy="-14" r="3" fill="#c9a84c" stroke="none"/>
    <circle cx="0" cy="0" r="3" fill="#c9a84c" stroke="none"/>
    <circle cx="16" cy="-14" r="3" fill="#c9a84c" stroke="none"/>
    <!-- Top gem -->
    <line x1="0" y1="0" x2="0" y2="-8"/>
    <circle cx="0" cy="-11" r="3.5" fill="#c9a84c" stroke="#f0e6cc" stroke-width="1.5"/>
  </g>

  <!-- M letter -->
  <text x="100" y="138" font-family="Georgia,serif" font-size="28" font-weight="600" fill="#f0e6cc" text-anchor="middle" letter-spacing="8">M</text>
</svg>
